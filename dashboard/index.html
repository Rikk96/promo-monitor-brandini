<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Brandini Promo Monitor</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+CiAgPGRlZnM+CiAgICA8bGluZWFyR3JhZGllbnQgaWQ9ImciIHgxPSIwIiB5MT0iMCIgeDI9IjEiIHkyPSIxIj4KICAgICAgPHN0b3Agb2Zmc2V0PSIwJSIgc3RvcC1jb2xvcj0iI2ZmZmZmZiIvPgogICAgICA8c3RvcCBvZmZzZXQ9IjEwMCUiIHN0b3AtY29sb3I9IiM5M2M1ZmQiLz4KICAgIDwvbGluZWFyR3JhZGllbnQ+CiAgPC9kZWZzPgogIDxyZWN0IHdpZHRoPSI2NCIgaGVpZ2h0PSI2NCIgcng9IjE0IiBmaWxsPSIjMGIwZjFhIi8+CiAgPHBhdGggZD0iTTE0IDMwIEwzMCAxNCBINDYgQTQgNCAwIDAgMSA1MCAxOCBWMzQgTDM0IDUwIEE0IDQgMCAwIDEgMjggNTAgTDE0IDM2IEE0IDQgMCAwIDEgMTQgMzAgWiIgZmlsbD0idXJsKCNnKSIvPgogIDxjaXJjbGUgY3g9IjQwIiBjeT0iMjQiIHI9IjMuNCIgZmlsbD0iIzBiMGYxYSIvPgo8L3N2Zz4K">

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, Arial, sans-serif;
      background: #090d18;
      color: #f5f7fb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top right, #17213c 0, transparent 35%),
        #090d18;
      min-height: 100vh;
    }

    main {
      width: min(1180px, 92%);
      margin: 0 auto;
      padding: 46px 0 70px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 24px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0 0 7px;
      font-size: clamp(30px, 5vw, 48px);
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #ffffff 0%, #93c5fd 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle, #updated {
      color: #9ca6ba;
      font-size: 14px;
    }

    .page-loaded {
      margin-top: 5px;
      font-size: 12px;
      color: #6b7896;
    }

    .reload-button {
      padding: 9px 14px;
      border: 1px solid #34415d;
      border-radius: 999px;
      background: #141b2d;
      color: #d3daf0;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease;
    }

    .reload-button:hover {
      background: #1b2438;
      border-color: #4c5c82;
    }

    #overall {
      padding: 10px 15px;
      border: 1px solid #34415d;
      border-radius: 999px;
      background: #141b2d;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 9px;
    }

    #overall .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #64748b;
    }

    #overall.error .dot {
      background: #ef4444;
      animation: pulse 1.8s ease-in-out infinite;
    }

    #overall.ok .dot {
      background: #22c55e;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, .55); }
      50% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
    }

    .notice {
      margin-top: 25px;
      padding: 14px 17px;
      border: 1px solid #4a4127;
      border-radius: 13px;
      background: #211d12;
      color: #f3d477;
      font-size: 14px;
      line-height: 1.5;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin: 25px 0 30px;
    }

    .metric, .card {
      background: rgba(20, 27, 45, 0.94);
      border: 1px solid #28334b;
      box-shadow: 0 14px 40px rgba(0, 0, 0, .16);
    }

    .metric {
      padding: 19px;
      border-radius: 15px;
    }

    .metric span {
      display: block;
      color: #97a2b7;
      font-size: 13px;
    }

    .metric strong {
      display: block;
      margin-top: 6px;
      font-size: 29px;
    }

    .metric.ok strong { color: #4ade80; }
    .metric.bad strong { color: #f87171; }
    .metric.pending strong { color: #fbbf24; }

    .avatar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      color: #0b0f1a;
      flex-shrink: 0;
    }

    .brand-name {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
      gap: 15px;
    }

    .card {
      padding: 18px;
      border-radius: 16px;
      border-left: 5px solid #64748b;
      display: flex;
      flex-direction: column;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      animation: rise .35s ease backwards;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 46px rgba(0, 0, 0, .28);
      border-color: #3a4a6b;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card > .force-button {
      margin-top: auto;
    }

    .card.ok { border-left-color: #22c55e; }
    .card.fail, .card.timeout, .card.missing { border-left-color: #ef4444; }
    .card.not_run { border-left-color: #f59e0b; }

    .card-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .brand {
      font-size: 18px;
      font-weight: 750;
    }

    .badge {
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      background: #29344c;
      white-space: nowrap;
    }

    .ok .badge { color: #86efac; background: #12301f; }
    .fail .badge, .timeout .badge, .missing .badge {
      color: #fca5a5;
      background: #3a161b;
    }
    .not_run .badge { color: #fcd34d; background: #36290c; }

    .duration {
      margin-top: 18px;
      color: #cbd3e1;
      font-size: 14px;
    }

    .script {
      margin-top: 5px;
      color: #7f8aa0;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    details {
      margin-top: 15px;
      border-top: 1px solid #2b354c;
      padding-top: 13px;
    }

    summary {
      cursor: pointer;
      color: #d3daf0;
      font-size: 13px;
      font-weight: 700;
    }

    pre {
      max-height: 360px;
      overflow: auto;
      margin: 13px 0 0;
      padding: 13px;
      border-radius: 10px;
      background: #070a12;
      color: #d8deea;
      font: 11px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .empty {
      padding: 25px;
      border: 1px solid #28334b;
      border-radius: 15px;
      background: #141b2d;
      color: #aab4c8;
    }


    .manual-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-top: 16px;
      padding: 14px 17px;
      border: 1px solid #28334b;
      border-radius: 13px;
      background: rgba(20, 27, 45, .94);
      color: #cbd3e1;
      font-size: 14px;
    }

    .manual-panel.busy {
      border-color: #7c5b16;
      color: #fcd34d;
    }

    .manual-panel.success {
      border-color: #176b3a;
      color: #86efac;
    }

    .manual-panel.failure {
      border-color: #7f2630;
      color: #fca5a5;
    }

    .manual-run {
      margin-top: 13px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #28334b;
      background: #101728;
      font-size: 12px;
    }

    .manual-run.ok {
      border-color: #1c4a30;
      background: #0f1f16;
    }

    .manual-run.fail, .manual-run.timeout {
      border-color: #5c2530;
      background: #23131a;
    }

    .manual-run-line {
      color: #c3cbdc;
      font-weight: 650;
    }

    .manual-run.ok .manual-run-line { color: #86efac; }
    .manual-run.fail .manual-run-line, .manual-run.timeout .manual-run-line { color: #fca5a5; }

    .manual-run summary {
      margin-top: 6px;
      font-size: 12px;
    }

    .force-button {
      width: 100%;
      margin-top: 15px;
      padding: 10px 12px;
      border: 1px solid #415171;
      border-radius: 10px;
      background: #202b43;
      color: #eef2ff;
      font-weight: 750;
      cursor: pointer;
    }

    .force-button:hover {
      background: #2a3857;
      border-color: #61749b;
    }

    .force-button:disabled {
      cursor: not-allowed;
      opacity: .45;
    }

    @media (max-width: 760px) {
      main { padding-top: 28px; }
      .summary { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>

<body>
<main>
  <header>
    <div>
      <h1>Promo Monitor</h1>
      <div class="subtitle">Controllo aggiornamenti promozioni Brandini</div>
      <div id="updated">Caricamento…</div>
      <div id="page-loaded" class="page-loaded"></div>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <button id="reload-btn" type="button" class="reload-button" title="Ricarica la pagina scaricando l'ultima versione">â» Ricarica</button>
      <div id="overall"><span class="dot"></span><span id="overall-text">Caricamento</span></div>
    </div>
  </header>

  <div id="historical-notice" class="notice" hidden></div>


  <div id="manual-panel" class="manual-panel">
    <span id="manual-status">Controllo manuale disponibile</span>
  </div>

  <section class="summary">
    <div class="metric">
      <span>Brand configurati</span>
      <strong id="configured">–</strong>
    </div>
    <div class="metric ok">
      <span>Completati</span>
      <strong id="ok">–</strong>
    </div>
    <div class="metric bad">
      <span>Errori</span>
      <strong id="bad">–</strong>
    </div>
    <div class="metric pending">
      <span>Non eseguiti</span>
      <strong id="not-run">–</strong>
    </div>
  </section>

  <section id="grid"></section>
</main>

<script>
  const $ = selector => document.querySelector(selector);

  function localDate(value) {
    if (!value) return "non disponibile";

    return new Intl.DateTimeFormat("it-IT", {
      dateStyle: "medium",
      timeStyle: "short",
      timeZone: "Europe/Rome"
    }).format(new Date(value));
  }

  function statusLabel(status) {
    return {
      OK: "OK",
      FAIL: "ERRORE",
      TIMEOUT: "TIMEOUT",
      MISSING: "MANCANTE",
      NOT_RUN: "NON ESEGUITO",
      RUNNING: "IN CORSO"
    }[status] || status;
  }

  function statusIcon(status) {
    return {
      OK: "✓",
      FAIL: "⚠",
      TIMEOUT: "⏱",
      MISSING: "⚠",
      NOT_RUN: "⏳",
      RUNNING: "…"
    }[status] || "•";
  }

  const AVATAR_PALETTE = [
    "#f87171", "#fb923c", "#fbbf24", "#a3e635",
    "#4ade80", "#34d399", "#2dd4bf", "#38bdf8",
    "#818cf8", "#a78bfa", "#e879f9", "#fb7185"
  ];

  function avatarColor(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) {
      hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
    }
    return AVATAR_PALETTE[hash % AVATAR_PALETTE.length];
  }

  function avatarInitials(name) {
    const words = name.replace("/", " ").trim().split(/\s+/);
    if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
    return (words[0][0] + words[1][0]).toUpperCase();
  }


  function brandKey(script) {
    return script.replace("_push_to_sheet.py", "");
  }

  function setButtonsDisabled(disabled) {
    document.querySelectorAll(".force-button").forEach(button => {
      button.disabled = disabled;
    });
  }

  function savedSecret() {
    let secret = localStorage.getItem("promoDashboardSecret");

    if (!secret) {
      secret = prompt("Inserisci la password della dashboard:");

      if (secret) {
        localStorage.setItem("promoDashboardSecret", secret);
      }
    }

    return secret;
  }

  async function forceBrand(item) {
    const confirmed = confirm(
      `Vuoi eseguire manualmente soltanto ${item.brand}?`
    );

    if (!confirmed) return;

    const secret = savedSecret();
    if (!secret) return;

    setButtonsDisabled(true);

    const response = await fetch("/api/control", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Dashboard-Secret": secret
      },
      body: JSON.stringify({
        brand: brandKey(item.script)
      })
    });

    const data = await response.json();

    if (response.status === 401) {
      localStorage.removeItem("promoDashboardSecret");
      setButtonsDisabled(false);
      alert("Password non valida. Riprova.");
      return;
    }

    if (!response.ok) {
      setButtonsDisabled(false);
      alert(
        [data.error, data.detail]
          .filter(Boolean)
          .join("\n")
      );
      return;
    }

    alert(`${item.brand}: aggiornamento messo in coda`);
    await loadCommand();
  }

  async function loadCommand() {
    const panel = $("#manual-panel");
    const label = $("#manual-status");

    try {
      const response = await fetch(`/api/control?t=${Date.now()}`, {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      const command = await response.json();
      const busy = ["PENDING", "RUNNING"].includes(command.status);

      panel.className = "manual-panel";
      setButtonsDisabled(busy);

      if (command.status === "PENDING") {
        panel.classList.add("busy");
        label.textContent =
          `${command.brand_label}: comando in coda, attesa worker VM`;
      } else if (command.status === "RUNNING") {
        panel.classList.add("busy");
        label.textContent =
          `${command.brand_label}: aggiornamento manuale in corso`;
      } else if (command.status === "COMPLETED") {
        panel.classList.add("success");
        label.textContent =
          `${command.brand_label}: ultimo aggiornamento manuale completato`;
      } else if (["FAILED", "REJECTED"].includes(command.status)) {
        panel.classList.add("failure");
        label.textContent =
          `${command.brand_label || "Comando"}: ultimo tentativo fallito`;
      } else {
        label.textContent = "Controllo manuale disponibile";
      }

    } catch (error) {
      panel.className = "manual-panel failure";
      label.textContent = "Controllo manuale temporaneamente non disponibile";
    }
  }

  function makeCard(item) {
    const article = document.createElement("article");
    article.className = "card " + item.status.toLowerCase();

    const head = document.createElement("div");
    head.className = "card-head";

    const brandBox = document.createElement("div");
    brandBox.className = "brand-name";

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.style.background = avatarColor(item.brand);
    avatar.textContent = avatarInitials(item.brand);

    const brand = document.createElement("div");
    brand.className = "brand";
    brand.textContent = item.brand;

    brandBox.append(avatar, brand);

    const badge = document.createElement("div");
    badge.className = "badge";
    badge.textContent = `${statusIcon(item.status)} ${statusLabel(item.status)}`;

    head.append(brandBox, badge);
    article.append(head);

    const duration = document.createElement("div");
    duration.className = "duration";
    duration.textContent = item.elapsed_seconds
      ? `Durata: ${item.elapsed_seconds} secondi`
      : "Durata non disponibile";
    article.append(duration);

    const script = document.createElement("div");
    script.className = "script";
    script.textContent = item.script;
    article.append(script);

    if (item.log_excerpt) {
      const details = document.createElement("details");
      const summary = document.createElement("summary");
      const pre = document.createElement("pre");

      summary.textContent = "Mostra dettagli errore";
      pre.textContent = item.log_excerpt;

      details.append(summary, pre);
      article.append(details);
    }

    if (item.last_manual_run) {
      const manual = item.last_manual_run;
      const box = document.createElement("div");
      box.className = "manual-run " + manual.status.toLowerCase();

      const line = document.createElement("div");
      line.className = "manual-run-line";
      line.textContent =
        `Ultimo forzato: ${statusLabel(manual.status)} · ` +
        localDate(manual.finished_at);
      box.append(line);

      if (manual.log_excerpt) {
        const details = document.createElement("details");
        const summary = document.createElement("summary");
        const pre = document.createElement("pre");

        summary.textContent = "Mostra log esecuzione manuale";
        pre.textContent = manual.log_excerpt;

        details.append(summary, pre);
        box.append(details);
      }

      article.append(box);
    }

    const forceButton = document.createElement("button");
    forceButton.className = "force-button";
    forceButton.type = "button";
    forceButton.textContent = "Forza aggiornamento";
    forceButton.addEventListener("click", () => forceBrand(item));
    article.append(forceButton);

    return article;
  }

  async function loadStatus() {
    const response = await fetch(`./status.json?t=${Date.now()}`, {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error(`Errore HTTP ${response.status}`);
    }

    const data = await response.json();

    $("#configured").textContent = data.totals.configured;
    $("#ok").textContent = data.totals.ok;
    $("#bad").textContent = data.totals.bad;
    $("#not-run").textContent = data.totals.not_run;

    $("#updated").textContent =
      `Ultimo ciclo: ${localDate(data.run_started_at)} · Run ${data.run_id}`;

    const isOk = data.overall_status === "OK";
    $("#overall").className = isOk ? "ok" : "error";
    $("#overall-text").textContent = isOk ? "Tutto regolare" : "Controllo richiesto";

    const runDate = new Date(data.run_started_at);
    const hoursOld = (Date.now() - runDate.getTime()) / 3600000;

    if (hoursOld > 20) {
      const notice = $("#historical-notice");
      notice.hidden = false;
      notice.textContent =
        "Attenzione: questi risultati appartengono a un ciclo precedente. " +
        "La dashboard verrà aggiornata automaticamente dopo la prossima esecuzione.";
    }

    const grid = $("#grid");
    grid.replaceChildren();

    if (!data.items.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Nessun risultato disponibile.";
      grid.append(empty);
      return;
    }

    const statusOrder = {
      FAIL: 0,
      TIMEOUT: 0,
      MISSING: 0,
      NOT_RUN: 1,
      OK: 2
    };

    const sortedItems = [...data.items].sort((a, b) => {
      const rankA = statusOrder[a.status] ?? 3;
      const rankB = statusOrder[b.status] ?? 3;
      return rankA - rankB;
    });

    sortedItems.forEach((item, index) => {
      const card = makeCard(item);
      card.style.animationDelay = `${Math.min(index * 28, 400)}ms`;
      grid.append(card);
    });
  }

  loadStatus().catch(error => {
    $("#updated").textContent = "Impossibile caricare lo stato";
    $("#overall").className = "error";
    $("#overall").innerHTML = '<span class="dot"></span>Errore dashboard';

    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = error.message;
    $("#grid").replaceChildren(empty);
  });

  loadCommand();
  setInterval(loadCommand, 10000);

  setInterval(() => {
    loadStatus().catch(() => {});
  }, 90000);

  function showPageLoadedTime() {
    const now = new Intl.DateTimeFormat("it-IT", {
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      timeZone: "Europe/Rome"
    }).format(new Date());
    $("#page-loaded").textContent = `Pagina caricata alle ${now}`;
  }

  showPageLoadedTime();

  $("#reload-btn").addEventListener("click", () => {
    window.location.href =
      window.location.pathname + "?_=" + Date.now();
  });
</script>
</body>
</html>
